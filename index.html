<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020204"><title>PromptLab — Digital Marketplace</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --soft:#f7f7f8;
  --soft-2:#f1f2f4;
  --text:#141414;
  --muted:#6f7177;
  --line:#e9eaed;
  --line-strong:#dcdde1;
  --purple:#6c57ee;
  --purple-soft:#f1efff;
  --purple-hover:#5a45de;
  --gold:#a66b00;
  --gold-soft:#fff8e8;
  --green:#177c4d;
  --shadow:0 8px 30px rgba(17,18,22,.06);
  --shadow-lg:0 18px 60px rgba(17,18,22,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.w{width:min(1180px,calc(100% - 40px));margin:auto}

.top{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(20,20,20,.06);
}
.nav{height:72px;display:flex;align-items:center;gap:28px}
.brand{
  margin-right:auto;
  font-size:1.17rem;
  font-weight:800;
  letter-spacing:-.045em;
  display:flex;align-items:center;gap:8px;
}
.brand:before{
  content:"";
  width:26px;height:26px;border-radius:8px;
  background:linear-gradient(145deg,#7a67f5,#5a43d5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.brand b{color:var(--purple)}
.links{display:flex;gap:25px;color:#575a61;font-size:.92rem}
.links a{transition:.18s color}
.links a:hover{color:#111}
.btn{
  border:1px solid transparent;
  border-radius:11px;
  padding:10px 15px;
  background:#151515;
  color:#fff;
  font-weight:700;
  transition:.18s transform,.18s background,.18s border-color,.18s box-shadow;
}
.btn:hover{transform:translateY(-1px)}
.primary{
  background:var(--purple);
  color:white;
  box-shadow:0 7px 22px rgba(108,87,238,.18);
}
.primary:hover{background:var(--purple-hover)}
.ghost{
  background:white;
  color:#252525;
  border-color:var(--line-strong);
}
.ghost:hover{background:var(--soft)}
.pill{
  border:1px solid #eadfbf;
  background:var(--gold-soft);
  border-radius:999px;
  padding:8px 11px;
  color:var(--gold);
  font-weight:800;
  font-size:.87rem;
}

.hero{
  padding:92px 0 68px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:60px;
  align-items:center;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;
  width:430px;height:430px;border-radius:50%;
  background:radial-gradient(circle,rgba(108,87,238,.09),rgba(108,87,238,0) 70%);
  right:-130px;top:-40px;pointer-events:none;
}
.tag{
  display:inline-flex;align-items:center;
  padding:6px 9px;
  border:1px solid var(--line);
  background:var(--soft);
  color:#595c63;
  border-radius:999px;
  font-size:.69rem;
  font-weight:800;
  letter-spacing:.075em;
  text-transform:uppercase;
}
.hero h1,.title{
  margin:18px 0 22px;
  font-size:clamp(3.2rem,6.8vw,6.25rem);
  line-height:.94;
  letter-spacing:-.068em;
  font-weight:760;
}
.title{font-size:clamp(2.7rem,5.5vw,5rem)}
.grad{color:var(--purple);background:none;-webkit-text-fill-color:initial}
.lead{
  max-width:700px;
  color:var(--muted);
  line-height:1.75;
  font-size:1.08rem;
}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  box-shadow:var(--shadow);
}
.hero .panel{
  background:linear-gradient(180deg,#fff,#fbfbfc);
  box-shadow:var(--shadow-lg);
  border-color:#e7e5f5;
}
.fake{
  margin-top:16px;
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  color:#7a7d84;
  font:500 .82rem/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
  filter:blur(2.2px);
  user-select:none;
}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}

.page{padding:58px 0 92px}
.page>h2{font-size:2rem;letter-spacing:-.035em;margin-top:40px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
  margin-top:20px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:.2s transform,.2s box-shadow,.2s border-color;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg);
  border-color:#dcd9ef;
}
.cover{
  height:200px;
  padding:17px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 20%,rgba(108,87,238,.19),transparent 35%),
    linear-gradient(135deg,#f7f5ff,#ece9ff);
}
.cover.cyan{
  background:
    radial-gradient(circle at 80% 18%,rgba(56,166,190,.16),transparent 36%),
    linear-gradient(135deg,#f5fbfc,#e8f5f7);
}
.cover.gold{
  background:
    radial-gradient(circle at 82% 20%,rgba(199,147,48,.15),transparent 36%),
    linear-gradient(135deg,#fffaf0,#f8f0da);
}
.badge{
  display:inline-flex;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(20,20,20,.08);
  border-radius:999px;
  padding:6px 9px;
  font-size:.69rem;
  font-weight:800;
  color:#474a50;
  backdrop-filter:blur(8px);
}
.emoji{
  position:absolute;
  left:18px;bottom:17px;
  font-size:2.1rem;
  filter:saturate(.9);
}
.body{padding:18px 18px 19px}
.meta{
  color:#878a91;
  font-size:.72rem;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.045em;
  font-weight:700;
}
.body h3{
  margin:0 0 8px;
  font-size:1.07rem;
  line-height:1.32;
  letter-spacing:-.02em;
}
.body p{
  color:var(--muted);
  line-height:1.58;
  font-size:.86rem;
  margin:0;
  min-height:54px;
}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:.82rem}
.price{color:var(--gold);font-weight:850}
.owned{color:var(--green);font-weight:800}

.ad{
  border:1px solid #ece6d7;
  background:#fffdf8;
  padding:17px 18px;
  border-radius:16px;
  margin:28px 0;
  display:flex;
  align-items:center;
  gap:18px;
}
.ad small{
  color:#9c7a34;
  text-transform:uppercase;
  letter-spacing:.095em;
  font-size:.64rem;
  font-weight:900;
}
.ad h4{margin:3px 0 4px;font-size:1rem}
.ad p{margin:0;color:#797b80;font-size:.84rem}
.ad .btn{margin-left:auto;white-space:nowrap;background:#fff;color:#292929;border-color:#ded8c9}

.search{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:24px 0}
.input,select,textarea{
  width:100%;
  background:white;
  color:#202020;
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
  transition:.18s border-color,.18s box-shadow;
}
.input:focus,select:focus,textarea:focus{
  border-color:#a99cf4;
  box-shadow:0 0 0 3px rgba(108,87,238,.08);
}

.prompt{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:24px;
}
.copy{color:#5f6268;line-height:1.82}
.secret{
  white-space:pre-wrap;
  background:#f8f8f9;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  color:#35373b;
  font:500 .84rem/1.72 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.lock{
  text-align:center;
  border:1px solid #ddd8ff;
  border-radius:16px;
  padding:30px;
  background:#faf9ff;
  margin-top:24px;
}
.info{
  display:flex;justify-content:space-between;gap:14px;
  border-top:1px solid var(--line);
  padding:12px 0;
  color:#74777d;
  font-size:.84rem;
}
.info b{color:#222}
.sticky{position:sticky;top:92px}

.auth{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.form{display:grid;gap:12px}
.tabs{
  display:flex;
  padding:4px;
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:17px;
}
.tabs button{
  flex:1;border:0;background:transparent;color:#7a7d83;
  padding:9px;border-radius:8px;font-weight:750;
}
.tabs .on{background:white;color:#161616;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.notice{
  border:1px solid #ddd8ff;
  background:#f8f7ff;
  color:#5b51a6;
  border-radius:11px;
  padding:11px;
  font-size:.84rem;
}
.wallet{
  font-size:3.7rem;
  font-weight:800;
  color:var(--gold);
  letter-spacing:-.06em;
}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.pack{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:var(--shadow);
}
.empty{
  grid-column:1/-1;
  text-align:center;
  border:1px dashed var(--line-strong);
  border-radius:16px;
  padding:48px;
  background:var(--soft);
  color:#777a80;
}
.hide{display:none!important}
.small{color:#85888f;font-size:.82rem;line-height:1.5}
.toast{
  position:fixed;
  right:20px;bottom:20px;
  background:#181818;color:#fff;
  border:1px solid #292929;
  border-radius:11px;
  padding:11px 13px;
  opacity:0;
  transform:translateY(6px);
  pointer-events:none;
  transition:.2s;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateY(0)}

.footer{
  border-top:1px solid var(--line);
  padding:30px 0 42px;
  color:#83868d;
  background:#fbfbfc;
}
.footer b{color:#222}

@media(max-width:900px){
  .hero,.prompt,.auth{grid-template-columns:1fr}
  .hero{gap:32px;padding-top:64px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .links{display:none}
  .sticky{position:static}
}
@media(max-width:620px){
  .w{width:min(100% - 24px,1180px)}
  .nav{height:64px}
  .hero{padding:50px 0 42px}
  .hero h1{font-size:clamp(2.75rem,14vw,4.6rem)}
  .grid,.packs{grid-template-columns:1fr}
  .search{grid-template-columns:1fr}
  .cover{height:180px}
  .ad{flex-direction:column;align-items:flex-start}
  .ad .btn{margin-left:0}
  .pill{display:none}
}

/* Admin dashboard */
.admin-page{padding-top:46px}
.admin-head,.admin-section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 48px}
.stat{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
.stat b{font-size:2rem;letter-spacing:-.05em}
.admin-section{margin-top:54px}
.admin-section-head{align-items:center;margin-bottom:16px}
.admin-section-head h2{margin:8px 0 0;font-size:1.75rem;letter-spacing:-.035em}
.admin-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.8fr);gap:18px;align-items:start}
.admin-list{padding:0;overflow:hidden}
.admin-row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:0}
.admin-row-actions{display:flex;gap:7px;flex-wrap:wrap}
.admin-row .btn{padding:8px 11px;font-size:.78rem}
.admin-form{position:sticky;top:92px}
.admin-form label{font-size:.8rem;font-weight:700;color:#5e6168;display:grid;gap:6px}
.admin-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:8px!important}
.check input{width:auto}
.admin-ad-summary{display:flex;align-items:center;gap:12px;min-width:0}
.admin-ad-summary img{width:110px;height:64px;object-fit:cover;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.ad-preview{border:1px dashed var(--line-strong);border-radius:12px;padding:12px;background:var(--soft);min-height:72px}
.ad-preview img{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:auto}
.ad{overflow:hidden}
.ad-image-link{display:block;flex:0 0 auto}
.ad-image{display:block;width:min(280px,32vw);max-height:120px;object-fit:contain;border-radius:11px;border:1px solid rgba(0,0,0,.05);background:white}
.ad-copy{min-width:0;flex:1}
.ad-side{display:block;padding:12px}
.ad-side .ad-image{width:100%;max-height:320px}
.ad-side .ad-copy{padding:10px 2px}
.ad-side .btn{margin:5px 0 0;width:100%;text-align:center}
@media(max-width:900px){
  .admin-stats{grid-template-columns:repeat(2,1fr)}
  .admin-layout{grid-template-columns:1fr}
  .admin-form{position:static}
  .ad-image{width:220px}
}
@media(max-width:620px){
  .admin-head,.admin-section-head,.admin-row{align-items:flex-start;flex-direction:column}
  .admin-stats{grid-template-columns:1fr 1fr}
  .admin-two{grid-template-columns:1fr}
  .ad-image{width:100%;max-height:220px}
  .admin-row-actions{width:100%}
}

/* Full affiliate banner rendering */
.ad.ad-banner{
  display:block;
  background:transparent;
  border:0;
  padding:0;
  margin:34px 0;
  overflow:visible;
}
.ad-banner .ad-label{
  margin:0 0 8px;
  color:#8b8e95;
  font-size:.66rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.ad-banner .ad-image-link{
  display:block;
  width:100%;
  text-align:center;
}
.ad-banner .ad-image{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:none;
  margin:0 auto;
  object-fit:contain;
  border:0;
  border-radius:10px;
  background:transparent;
}
.ad-side.ad-banner .ad-image{
  width:auto;
  max-width:100%;
  max-height:none;
}
@media(max-width:620px){
  .ad.ad-banner{margin:26px 0}
  .ad-banner .ad-image{width:100%;height:auto}
}
.cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-photo+.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.28))}
.cover .badge,.cover .emoji{position:relative;z-index:2}
.delivery-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.delivery-actions .btn{display:inline-block}
.product-kicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.type-pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--purple-soft);color:#5d4fc6;font-size:.7rem;font-weight:800}
.detail-version{color:#8a8d94;font-size:.78rem}
.content-block{margin-top:24px}

/* Store analytics, membership & trust */
.member-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#f1efff;color:#5d4fc6;font-size:.72rem;font-weight:800}
.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.analytics-list{margin-top:10px}
.analytics-item{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:.84rem}
.customer-row{display:grid;grid-template-columns:minmax(190px,1.4fr) .7fr .6fr .6fr .8fr;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);font-size:.8rem}
.customer-row.head{color:var(--muted);font-weight:800;background:var(--soft)}
.trust-box{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:.82rem;color:var(--muted);line-height:1.6}
.policy-links{display:flex;gap:14px;flex-wrap:wrap}
@media(max-width:760px){.analytics-grid{grid-template-columns:1fr}.customer-row{grid-template-columns:1fr 1fr}.customer-row.head{display:none}.customer-row>div:first-child{grid-column:1/-1}}

/* Membership and checkout */
.dual-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px}
.dual-price strong{font-size:1.05rem}
.dual-price .or{color:var(--muted);font-size:.75rem}
.member-note{display:inline-flex;margin-top:8px;padding:5px 8px;border-radius:999px;background:#f1efff;color:#5d4fc6;font-size:.7rem;font-weight:800}
.plan-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:22px;align-items:start}
.plan-card{border:1px solid #ddd8ff;background:linear-gradient(180deg,#fff,#faf9ff);border-radius:20px;padding:28px;box-shadow:var(--shadow-lg)}
.plan-price{font-size:3rem;font-weight:850;letter-spacing:-.055em;margin:12px 0}
.plan-price small{font-size:.9rem;color:var(--muted);font-weight:650;letter-spacing:0}
.benefits{display:grid;gap:10px;margin:22px 0}
.benefit{display:flex;gap:10px;color:#555960;font-size:.9rem}
.checkout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.pay-methods{display:grid;gap:10px;margin-top:18px}
.pay-method{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.pay-method span:first-child{font-size:1.15rem}
.pending-box{border:1px solid #eadfbf;background:var(--gold-soft);color:#75520c;border-radius:12px;padding:13px;font-size:.84rem;line-height:1.55;margin-top:14px}
.member-only{display:inline-flex;padding:5px 8px;border-radius:999px;background:#151515;color:#fff;font-size:.68rem;font-weight:800}
@media(max-width:900px){.plan-grid,.checkout{grid-template-columns:1fr}}

/* Marketplace homepage */
.market-hero{padding:58px 0 34px;border-bottom:1px solid var(--line)}
.market-hero-inner{max-width:880px}
.market-hero h1{font-size:clamp(2.8rem,6vw,5.1rem);line-height:.98;letter-spacing:-.06em;margin:17px 0 17px}
.market-hero .lead{max-width:780px;margin-bottom:24px}
.home-search{display:flex;gap:10px;max-width:760px}
.home-search .input{padding:14px 15px;font-size:1rem}
.home-search .btn{padding-left:22px;padding-right:22px;white-space:nowrap}
.quick-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.quick-chip{display:inline-flex;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#555960;font-size:.78rem;font-weight:750;transition:.18s}
.quick-chip:hover{border-color:#cbc6ef;background:var(--purple-soft);color:#5145b5}
.home-section{padding:42px 0 8px}
.home-section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}
.home-section-head h2{margin:6px 0 0;font-size:1.85rem;letter-spacing:-.035em}
.home-section-head a{font-size:.84rem;color:var(--purple);font-weight:800}
.home-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:0}
.home-grid .cover{height:165px}
.member-strip{margin:44px 0 12px;padding:24px 28px;border:1px solid #ddd8ff;border-radius:20px;background:linear-gradient(110deg,#faf9ff,#fff);display:flex;align-items:center;justify-content:space-between;gap:22px}
.member-strip h3{margin:6px 0;font-size:1.45rem;letter-spacing:-.03em}
.member-strip p{margin:0;color:var(--muted);line-height:1.6}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.category-box{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;transition:.18s}
.category-box:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#dcd9ef}
.category-box b{display:block;margin-bottom:7px}
.category-box span{font-size:.82rem;color:var(--muted)}
/* Credit pack fix */

/* SOSCALE-inspired homepage hero */
.home-hero-mode .top{display:none}
.pl-stage{
  --phu:min(calc(100vw / 1280),calc(100svh / 640));
  --ph-frame-w:calc(1280 * var(--phu));
  position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:#000;color:#fff;isolation:isolate
}
.pl-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:54% 50%;z-index:0;user-select:none;pointer-events:none}
.pl-band{position:absolute;inset:0 0 auto;z-index:2;display:grid;grid-template-columns:1fr var(--ph-frame-w) 1fr;grid-template-rows:calc(112 * var(--phu)) calc(var(--ph-frame-w) * 190 / 1280) calc(12 * var(--phu))}
.pl-band-top,.pl-band-bot{grid-column:1/-1;background:#000}
.pl-wordmark{grid-column:2;grid-row:2;position:relative;line-height:0;overflow:hidden}
.pl-wordmark svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.pl-wordmark text{font-family:Arial Black,Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-18px}
.pl-lid{position:absolute;top:0;bottom:0;width:12%;background:#000;z-index:3;transform-origin:50% 0}
.pl-lid:nth-of-type(1){left:0}.pl-lid:nth-of-type(2){left:11.3%}.pl-lid:nth-of-type(3){left:22.6%}.pl-lid:nth-of-type(4){left:33.9%}.pl-lid:nth-of-type(5){left:45.2%}.pl-lid:nth-of-type(6){left:56.5%}.pl-lid:nth-of-type(7){left:67.8%}.pl-lid:nth-of-type(8){left:79.1%}.pl-lid:nth-of-type(9){left:90.4%;width:9.6%}
.pl-nav{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1280px,100%);height:calc(82 * var(--phu));min-height:60px;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(18px,2.5vw,32px);gap:18px;color:#c2c2c2}
.pl-menu{display:none;background:none;border:0;color:inherit;font:inherit;font-size:.82rem;letter-spacing:-.02em;padding:10px 0;align-items:center;gap:10px}
.pl-menu-icon{position:relative;width:18px;height:8px;display:inline-block}
.pl-menu-icon:before,.pl-menu-icon:after{content:"";position:absolute;left:0;right:0;height:1px;background:currentColor;transition:.22s transform}
.pl-menu-icon:before{top:0}.pl-menu-icon:after{bottom:0}
.pl-nav.is-open .pl-menu-icon:before{transform:translateY(3.5px) rotate(45deg)}
.pl-nav.is-open .pl-menu-icon:after{transform:translateY(-3.5px) rotate(-45deg)}
.pl-navlinks{justify-self:start;display:flex;gap:24px;font-size:.78rem;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.pl-navlinks a{transition:.15s opacity}.pl-navlinks a:hover{opacity:.58}
.pl-tagline{justify-self:center;font-size:.78rem;font-weight:400;letter-spacing:-.035em;word-spacing:.18em;white-space:nowrap;color:#c2c2c2}
.pl-cta{justify-self:end;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;background:#DEC1FC;color:#1a0b1f;border-radius:3px;font-size:.78rem;font-weight:600;white-space:nowrap;transition:.15s filter}

.pl-cta svg{width:11px;height:11px}
.pl-copy{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(1280px,100%);height:110px;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:0 20px;text-align:center}
.pl-headline{margin:0;font-size:clamp(1.25rem,2.25vw,1.85rem);line-height:1;letter-spacing:-.035em;font-weight:400;word-spacing:.18em;white-space:nowrap}
.pl-meta{display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.78);font:500 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.pl-meta-dot{width:5px;height:5px;border-radius:50%;background:#00B67A}
.pl-enter{opacity:0;transform:translateY(7px)}
.pl-copy .pl-headline{transform:translateY(100%);clip-path:inset(-100% -8px 100% -8px)}
.pl-cta{clip-path:inset(0 100% 0 0)}
.pl-stage.entered .pl-lid{animation:plLid 1s cubic-bezier(.76,0,.24,1) forwards}
.pl-stage.entered .pl-lid:nth-of-type(1){animation-delay:.06s}.pl-stage.entered .pl-lid:nth-of-type(2){animation-delay:.12s}.pl-stage.entered .pl-lid:nth-of-type(3){animation-delay:.18s}.pl-stage.entered .pl-lid:nth-of-type(4){animation-delay:.24s}.pl-stage.entered .pl-lid:nth-of-type(5){animation-delay:.30s}.pl-stage.entered .pl-lid:nth-of-type(6){animation-delay:.36s}.pl-stage.entered .pl-lid:nth-of-type(7){animation-delay:.42s}.pl-stage.entered .pl-lid:nth-of-type(8){animation-delay:.48s}.pl-stage.entered .pl-lid:nth-of-type(9){animation-delay:.54s}
.pl-stage.entered .pl-navlinks{animation:plRise .6s cubic-bezier(.16,1,.3,1) .5s forwards}
.pl-stage.entered .pl-tagline{animation:plRise .6s cubic-bezier(.16,1,.3,1) .7s forwards}

.pl-stage.entered .pl-cta{animation:plWipe .75s cubic-bezier(.16,1,.3,1) 1.1s forwards}
.pl-stage.entered .pl-meta{animation:plRise .7s cubic-bezier(.16,1,.3,1) 1.2s forwards}
@keyframes plLid{from{transform:scaleY(1)}to{transform:scaleY(0)}}
@keyframes plRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes plHeadline{from{transform:translateY(100%);clip-path:inset(-100% -8px 100% -8px)}to{transform:none;clip-path:inset(0 -8px 0 -8px)}}
@keyframes plWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
